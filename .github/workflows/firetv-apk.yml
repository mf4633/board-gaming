name: firetv-apk

# Builds the Fire TV APK. The Android SDK is not vendored anywhere in this repo,
# so the runner's preinstalled SDK is what makes this reproducible.
#
# Signing is optional. With the four BGHTV_* secrets set the release variant is
# built and signed; without them the job produces a debug-signed APK, which
# sideloads onto a Fire TV perfectly well — it just cannot be uploaded to the
# Amazon Appstore.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Attach the built APK to the firetv-v1 release'
        type: boolean
        default: false
  pull_request:
    paths:
      - 'android-tv/**'
      - '.github/workflows/firetv-apk.yml'
  push:
    branches: [main]
    paths:
      - 'android-tv/**'
      - '.github/workflows/firetv-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-tv

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Stage release keystore if one is configured
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.BGHTV_KEYSTORE_BASE64 }}
        run: |
          set -eu
          if [ -n "${KEYSTORE_B64:-}" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/bghtv.jks"
            echo "keystore=$RUNNER_TEMP/bghtv.jks" >> "$GITHUB_OUTPUT"
            echo "variant=release" >> "$GITHUB_OUTPUT"
            echo "Release keystore staged."
          else
            echo "keystore=" >> "$GITHUB_OUTPUT"
            echo "variant=debug" >> "$GITHUB_OUTPUT"
            echo "No BGHTV_KEYSTORE_BASE64 secret — building a debug-signed APK."
          fi

      - name: Build APK
        env:
          BGHTV_KEYSTORE: ${{ steps.signing.outputs.keystore }}
          BGHTV_KEYSTORE_PASSWORD: ${{ secrets.BGHTV_KEYSTORE_PASSWORD }}
          BGHTV_KEY_ALIAS: ${{ secrets.BGHTV_KEY_ALIAS }}
          BGHTV_KEY_PASSWORD: ${{ secrets.BGHTV_KEY_PASSWORD }}
        run: |
          set -eu
          chmod +x ./gradlew
          if [ "${{ steps.signing.outputs.variant }}" = "release" ]; then
            ./gradlew --no-daemon --stacktrace assembleRelease
          else
            ./gradlew --no-daemon --stacktrace assembleDebug
          fi

      - name: Collect APK
        run: |
          set -eu
          mkdir -p "$GITHUB_WORKSPACE/out"
          apk=$(find app/build/outputs/apk -name '*.apk' -type f | head -1)
          if [ -z "$apk" ]; then
            echo "::error::no APK produced"
            exit 1
          fi
          cp "$apk" "$GITHUB_WORKSPACE/out/boardgaminghub-tv.apk"
          ls -la "$GITHUB_WORKSPACE/out"

      # Verifies the two manifest facts a Fire TV install actually depends on.
      # Getting either wrong installs fine and then never appears on the home
      # row, which is a miserable thing to debug on a television.
      - name: Verify Fire TV manifest requirements
        run: |
          set -eu
          aapt2=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -1)
          dump=$("$aapt2" dump badging "$GITHUB_WORKSPACE/out/boardgaminghub-tv.apk")
          echo "$dump" | grep -E "package:|launchable-activity|uses-feature|uses-permission" || true
          echo "$dump" | grep -q "android.intent.category.LEANBACK_LAUNCHER" \
            || { echo "::error::no LEANBACK_LAUNCHER category — the app will not show on the Fire TV home row"; exit 1; }
          echo "$dump" | grep -q "uses-feature-not-required:'android.hardware.touchscreen'" \
            || { echo "::error::touchscreen is not marked not-required — Fire TV will treat this as a phone-only app"; exit 1; }
          echo "Fire TV manifest requirements OK."

      - uses: actions/upload-artifact@v4
        with:
          name: boardgaminghub-tv-apk
          path: out/boardgaminghub-tv.apk
          if-no-files-found: error

      - name: Publish to the firetv-v1 release
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release view firetv-v1 >/dev/null 2>&1 || gh release create firetv-v1 \
            --title "Board Gaming Hub for Fire TV" \
            --notes "Sideload build. Install with the Downloader app or adb; see FIRETV.md."
          gh release upload firetv-v1 "$GITHUB_WORKSPACE/out/boardgaminghub-tv.apk" --clobber
